services:
  db:
    image: postgres:16
    container_name: docintel-db
    environment:
      POSTGRES_USER: docintel
      POSTGRES_PASSWORD: docintel
      POSTGRES_DB: docintel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docintel"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: docintel-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: docker
      DATABASE_URL: postgresql+psycopg://docintel:docintel@db:5432/docintel
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      CORS_ORIGINS: http://localhost:3000
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_MB: 20
    ports:
      - "8001:8000"
    volumes:
      - appdata:/data

volumes:
  pgdata:
  appdata:
